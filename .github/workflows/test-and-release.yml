name: Test and Release

# Nutzt die offiziellen wiederverwendbaren ioBroker-GitHub-Actions
# (https://github.com/ioBroker/testing-action-check,
#  https://github.com/ioBroker/testing-action-adapter,
#  https://github.com/ioBroker/testing-action-deploy).
# Der Deploy-Schritt nutzt npm Trusted Publishing (OIDC) - dafür muss unter
# npmjs.com/package/iobroker.apple-device-finder/access ein Trusted Publisher
# für dieses Repository + diese Workflow-Datei eingetragen sein. Kein
# NPM_TOKEN-Secret noetig.

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: "22.x"
          lint: false

  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  deploy:
    needs: [check-and-lint, adapter-tests]

    # Laeuft nur, wenn ein Commit mit einem Versions-Tag (vX.Y.Z) gepusht wird.
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      id-token: write # noetig fuer npm Trusted Publishing (OIDC)
      contents: write # noetig fuer das GitHub-Release

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # npm-token bewusst weggelassen - Trusted Publishing (OIDC) ist
          # unter npmjs.com fuer dieses Repository konfiguriert.
